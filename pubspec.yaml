name: clim_app_service
description: "This project is clim app"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/logos/
    - assets/images/navigator/
    - assets/images/pages/

  fonts:
    - family: Inter
      fonts:
          - asset: assets/fonts/Inter/Inter-Thin.ttf
            weight: 100
          - asset: assets/fonts/Inter/Inter-ExtraLight.ttf
            weight: 200
          - asset: assets/fonts/Inter/Inter-Light.ttf
            weight: 300
          - asset: assets/fonts/Inter/Inter-Regular.ttf
            weight: 400
          - asset: assets/fonts/Inter/Inter-Medium.ttf
            weight: 500
          - asset: assets/fonts/Inter/Inter-SemiBold.ttf
            weight: 600
          - asset: assets/fonts/Inter/Inter-Bold.ttf
            weight: 700
          - asset: assets/fonts/Inter/Inter-ExtraBold.ttf
            weight: 800
          - asset: assets/fonts/Inter/Inter-Black.ttf
            weight: 900